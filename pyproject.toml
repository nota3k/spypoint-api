[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "spypoint-api"
dynamic = ["version"]
description = "Async Python client for SPYPOINT (generated from OpenAPI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "Your Name", email = "you@example.com" } ]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "tenacity>=8",
  "python-dateutil",
  "typing-extensions; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.hatch.dynamic]
version = { attr = "spypoint_api._version.__version__" }

[tool.hatch.build.targets.wheel]
packages = ["spypointapi", "spypoint_api"]
